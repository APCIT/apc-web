trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  azureSubscription: 'APC-Azure'
  webAppName: 'apc-ua-next'

stages:
  - stage: Build
    displayName: Build Next.js app
    jobs:
      - job: Build
        steps:
          - task: UseNode@1
            inputs:
              version: '22.x'
            displayName: 'Install Node.js'

          - task: Cache@2
            inputs:
              key: 'npm | "$(Agent.OS)" | package-lock.json'
              restoreKeys: |
                npm | "$(Agent.OS)"
              path: $(Pipeline.Workspace)/.npm
            displayName: 'Cache npm'

          - script: npm config set cache $(Pipeline.Workspace)/.npm --global
            displayName: 'Point npm to cache dir'

          - script: npm ci
            displayName: 'Install dependencies'
            env:
              DATABASE_URL: $(DATABASE_URL)

          - script: npx prisma generate
            displayName: 'Generate Prisma Client'
            env:
              DATABASE_URL: $(DATABASE_URL)

          # DATABASE_URL must point at the same database the App Service runs against,
          # otherwise schema changes are applied to the wrong database and the deploy
          # silently ships code that the production schema cannot satisfy.
          - script: npx prisma migrate deploy
            displayName: 'Apply database migrations'
            env:
              DATABASE_URL: $(DATABASE_URL)

          - script: npm run build --if-present
            displayName: 'Build Next.js'
            env:
              DATABASE_URL: $(DATABASE_URL)
              NEXT_TELEMETRY_DISABLED: '1'

          - script: |
              set -e
              mkdir -p $(Build.ArtifactStagingDirectory)/deploy
              cp -r .next/standalone/. $(Build.ArtifactStagingDirectory)/deploy/
              mkdir -p $(Build.ArtifactStagingDirectory)/deploy/.next
              cp -r .next/static $(Build.ArtifactStagingDirectory)/deploy/.next/static
              if [ -d public ]; then cp -r public $(Build.ArtifactStagingDirectory)/deploy/public; fi
              if [ -d prisma ]; then cp -r prisma $(Build.ArtifactStagingDirectory)/deploy/prisma; fi
              ls -la $(Build.ArtifactStagingDirectory)/deploy
            displayName: 'Assemble standalone package'

          - task: ArchiveFiles@2
            inputs:
              rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/deploy'
              includeRootFolder: false
              archiveType: zip
              archiveFile: '$(Build.ArtifactStagingDirectory)/app.zip'
              replaceExistingArchive: true
            displayName: 'Zip standalone build'

          - publish: '$(Build.ArtifactStagingDirectory)/app.zip'
            artifact: drop

  - stage: Deploy
    displayName: Deploy to App Service
    dependsOn: Build
    jobs:
      - deployment: Deploy
        environment: 'apc-ua-next'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: drop

                - task: AzureWebApp@1
                  inputs:
                    azureSubscription: $(azureSubscription)
                    appType: 'webAppLinux'
                    appName: $(webAppName)
                    package: '$(Pipeline.Workspace)/drop/app.zip'
                    startUpCommand: 'node server.js'
